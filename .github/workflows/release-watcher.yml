name: Release Watcher

on:
  push:
    branches:
      - main

  schedule:
    - cron: '0 9 * * 1'

  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Show release information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Current date and time:"
          date

      - name: Finish release watch
        run: |
          echo "Release watch complete"