name: PR Gatekeeper

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Show PR information
        run: |
          echo "Target branch: ${{ github.base_ref }}"
          echo "PR number: ${{ github.event.pull_request.number }}"

      - name: Finish checks
        run: |
          echo "Gatekeeper checks complete"